# Só o Postgres local. A API e o front rodam no Node (npm run server:dev e npm run dev).
# A publicação em container (nginx, Caddy, imagens) foi removida em 2026-10-20,
# junto com a EC2. O empacotamento volta quando o servidor corporativo existir.
services:
  postgres:
    image: postgres:16-alpine
    container_name: acervo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acervo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acervo}
      POSTGRES_DB: ${POSTGRES_DB:-acervo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - acervo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-acervo} -d $${POSTGRES_DB:-acervo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  acervo_pgdata:
