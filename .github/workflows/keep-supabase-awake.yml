name: Manter Supabase acordado

on:
  schedule:
    # Terça e sexta 11:00 UTC (8h em Brasília). O Free pausa após 7 dias sem consulta.
    - cron: "0 11 * * 2,5"
  workflow_dispatch:
  # Roda uma vez neste push para validar o ping sem depender de secret.
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-supabase-awake.yml"

jobs:
  ping:
    name: Ping no Postgres
    runs-on: ubuntu-latest
    steps:
      - name: Consulta keep_alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://iezvzcrmzdfljvbbdneu.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_ei2HWMFUa7NM-JRpO8f1lg_lqghcY7s}"
          curl -sS --fail \
            "${URL%/}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Accept: application/json"
