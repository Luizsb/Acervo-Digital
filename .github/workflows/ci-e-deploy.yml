name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instala dependências do frontend
        run: npm ci

      - name: Audita dependências do frontend (SCA)
        run: npm audit --omit=dev --audit-level=high

      - name: Verifica os tipos do frontend
        run: npm run typecheck

      - name: Roda os testes
        run: npm test

      - name: Compila o frontend
        run: npm run build

      - name: Instala dependências da API
        working-directory: server
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Audita dependências da API (SCA)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Verifica os tipos da API
        working-directory: server
        run: npx tsc --noEmit

  container:
    name: Container (build e subida)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Constrói as imagens da API e do site
        run: docker compose --profile app build

      - name: Sobe o Acervo e espera as verificações de saúde
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          export JWT_SECRET
          docker compose --profile app up -d --wait --wait-timeout 300

      - name: Confere site, API e banco pelo nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/health
          TOKEN="$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"demo@acervo.local","password":"demo1234"}' \
            http://127.0.0.1:8080/api/auth/login | jq -r .token)"
          curl -fsS -o /dev/null -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/odas

      - name: Mostra os logs se algo falhar
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Derruba os containers
        if: always()
        run: docker compose --profile app down -v
