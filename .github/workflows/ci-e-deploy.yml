name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:
  # Permite repetir o deploy pela aba Actions sem precisar de um novo commit.
  workflow_dispatch:

# Um deploy por vez: dois builds simultâneos na mesma instância se atropelam.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instala dependências do frontend
        run: npm ci

      - name: Roda os testes
        run: npm test

      - name: Compila o frontend
        run: npm run build

      - name: Instala dependências da API
        working-directory: server
        run: npm ci
        env:
          # Os navegadores do Playwright só são necessários para capturar capas.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Verifica os tipos da API
        working-directory: server
        run: npx tsc --noEmit

  publicar:
    name: Deploy na EC2
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confere os segredos de acesso
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_USER }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Defina EC2_HOST, EC2_USER e EC2_SSH_KEY em Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Prepara o acesso SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Atualiza a instância
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' < scripts/deploy-ec2.sh
