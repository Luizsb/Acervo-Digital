name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instala dependências do frontend
        run: npm ci

      - name: Roda os testes
        run: npm test

      - name: Compila o frontend
        run: npm run build

      - name: Instala dependências da API
        working-directory: server
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Verifica os tipos da API
        working-directory: server
        run: npx tsc --noEmit
