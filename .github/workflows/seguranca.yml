name: Segurança

# SAST (CodeQL) e análise de IaC (Trivy). Os achados aparecem na aba Security → Code scanning.
# SCA fica no CI (npm audit) e no Dependabot (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Segunda 9:00 UTC: pega vulnerabilidades novas mesmo sem commit.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql

  iac:
    name: IaC (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Fixado por SHA (v0.36.0): action de terceiro com acesso ao código.
      - name: Varre Dockerfiles, Compose e workflows
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: node_modules,server/node_modules,public,data
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-iac.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
